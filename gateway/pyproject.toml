[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ams-gateway"
version = "1.0.0"
description = "AMS Gateway MVP：本地任务/服务/产物网关（FastAPI + SQLite + SSE）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary (AMS internal)" }
authors = [{ name = "AMS Team" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[project.scripts]
ams-gateway = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using .*httpx.*starlette.testclient.*",
]
